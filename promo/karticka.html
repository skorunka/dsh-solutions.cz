<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>DSH Solutions — kartička k ceně do tomboly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Kartička 85 × 55 mm k AirPods do tomboly. Arch A4, jedna kartička uprostřed,
     strana 1 přední, strana 2 zadní. Oboustranně s otáčením podél dlouhé strany.
     Přední strana má 2 mm spadávku přes ořez a značky řezu; řeže se z přední strany.
     Kartička je přesně uprostřed archu, takže zadní strana po otočení sedí za
     přední. Zadní strana je bílá s obsahem 5 mm od kraje: posun duplexu
     o 1–2 mm na ní není vidět. */
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #444; font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
  .sheet { width: 210mm; height: 297mm; margin: 10mm auto; background: #fff; position: relative; overflow: hidden;
    page-break-after: always; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet:last-child { page-break-after: auto; }
  @media print { html, body { background: #fff; } .sheet { margin: 0; } }

  /* Jedna karta 85 × 55 mm přesně uprostřed archu. */
  .card { position: absolute; width: 85mm; height: 55mm; }
  .c1 { left: 62.5mm; top: 121mm; }

  /* ---------- přední strana ---------- */
  .front .card::before { /* tmavé pozadí se spadávkou 2 mm */
    content: ''; position: absolute; inset: -2mm; background: #0a0a0f;
    background-image:
      radial-gradient(circle at 88% 0%, rgba(68,102,255,.55), transparent 55%),
      radial-gradient(circle at 0% 110%, rgba(153,68,255,.35), transparent 50%);
  }
  .front .card > * { position: relative; }
  .front .inner { height: 100%; padding: 5.5mm 6mm 5mm; color: #fff; display: flex; flex-direction: column; }
  .logo { display: flex; align-items: center; gap: 2mm; }
  .logo i { width: 8.5mm; height: 7mm; border-radius: 1.8mm; background: linear-gradient(135deg, #4466ff, #9944ff);
    display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 800; font-size: 6pt; letter-spacing: .2pt; }
  .logo b { font-weight: 700; font-size: 7.5pt; }
  .congrats { margin-top: auto; font-size: 9pt; font-weight: 700; letter-spacing: .2pt;
    background: linear-gradient(135deg, #8a9aff, #c88aff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .front h1 { margin-top: 1mm; font-size: 17pt; line-height: 1.05; font-weight: 800; letter-spacing: -.4pt; }
  .wish { margin-top: 2.5mm; font-size: 6.5pt; color: #b8b8c8; }

  /* značky řezu: 3 mm dlouhé, 3 mm od ořezu */
  .crop { position: absolute; background: #9a9aa6; }

  /* ---------- zadní strana ---------- */
  .back .inner { height: 100%; padding: 5mm 5.5mm; color: #1a1a2e; display: flex; flex-direction: column; }
  .back h2 { font-size: 10pt; font-weight: 800; letter-spacing: -.2pt; }
  .back p { margin-top: 1.6mm; font-size: 6.6pt; line-height: 1.45; color: #555570; }
  .back p strong { color: #1a1a2e; font-weight: 600; }
  .back .row { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 3mm; }
  .back .url { font-size: 8.5pt; font-weight: 800; }
  .back .url span { display: block; margin-top: .6mm; font-size: 6.2pt; font-weight: 500; color: #8888a0; }
  .qr { width: 16mm; height: 16mm; flex-shrink: 0; }
  .qr img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>

<template id="front">
  <div class="inner">
    <div class="logo"><i>DSH</i><b>DSH Solutions</b></div>
    <p class="congrats">Gratulujeme!</p>
    <h1>Sluchátka jsou vaše.</h1>
    <p class="wish">S přáním krásného plesu</p>
  </div>
</template>

<template id="back">
  <div class="inner">
    <h2>Hudbu máte vyřešenou.</h2>
    <p>A kdyby vás někdy něco zdržovalo, třeba objednávky v Excelu nebo rezervace přes WhatsApp, uděláme z toho aplikaci. <strong>Konzultace je vždycky zdarma.</strong></p>
    <div class="row">
      <div class="url">dsh-solutions.cz<span>info@dsh-solutions.cz</span></div>
      <div class="qr"><img src="qr-dsh.svg" alt="QR kód: dsh-solutions.cz"></div>
    </div>
  </div>
</template>

<section class="sheet front" id="sheetFront"></section>
<section class="sheet back" id="sheetBack"></section>

<script>
  [['sheetFront', 'front'], ['sheetBack', 'back']].forEach(function (pair) {
    var sheet = document.getElementById(pair[0]);
    var tpl = document.getElementById(pair[1]);
    for (var i = 1; i <= 1; i++) {
      var card = document.createElement('div');
      card.className = 'card c' + i;
      card.appendChild(tpl.content.cloneNode(true));
      sheet.appendChild(card);
    }
  });

  // Značky řezu na přední straně: u každého rohu každé karty, mimo spadávku.
  var front = document.getElementById('sheetFront');
  var cards = [[62.5, 121]];
  var W = 85, H = 55, OFF = 3, LEN = 3, T = 0.15;
  function mark(x, y, w, h) {
    var m = document.createElement('i');
    m.className = 'crop';
    m.style.cssText = 'left:' + x + 'mm;top:' + y + 'mm;width:' + w + 'mm;height:' + h + 'mm';
    front.appendChild(m);
  }
  cards.forEach(function (c) {
    var L = c[0], Tp = c[1], R = L + W, B = Tp + H;
    // svislé linky (nad a pod kartou)
    [L, R].forEach(function (x) {
      mark(x - T / 2, Tp - OFF - LEN, T, LEN);
      mark(x - T / 2, B + OFF, T, LEN);
    });
    // vodorovné linky (vlevo a vpravo od karty)
    [Tp, B].forEach(function (y) {
      mark(L - OFF - LEN, y - T / 2, LEN, T);
      mark(R + OFF, y - T / 2, LEN, T);
    });
  });
</script>
</body>
</html>
